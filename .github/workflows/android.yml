name: Android APK bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --no-daemon -p android

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fufcord-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release erstellen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          body: |
            ## 📱 Fufcord — Custom Discord Rich Presence (Android-App)

            **Installation:** APK aufs Handy laden → installieren → im Setup-Assistenten Token eintragen → START.
            Die App läuft im Hintergrund, meldet neue Versionen automatisch per Pop-up und updated per Download von hier.

            **Enthalten:** Hintergrund-Service, Bilder-Upload, 1:1-Discord-Vorschau, Setup-Assistent, Presets, JSON Im-/Export (KI), Doktor mit Auto-Reparatur, Sicher-Modus.

            **Quellcode:** Vollständig Open Source (MIT-Lizenz) — siehe Tab **Code** → Ordner `android/`. © 2026 Fufcord, alle Rechte vorbehalten.
