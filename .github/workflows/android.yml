name: Android APK bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Debug-APK bauen (stabil signiert)
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > /tmp/fufcord.p12
            export FUF_KEYSTORE_PATH=/tmp/fufcord.p12
            export FUF_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}"
            export FUF_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
            export FUF_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"
            echo "Stabile Signierung aktiv."
          else
            echo "Kein Signatur-Secret — Standard-Debug-Signatur."
          fi
          gradle :app:assembleDebug --no-daemon -p android

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fufcord-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Patch-APK bauen
        run: gradle :patch:assembleDebug --no-daemon -p android

      - name: Patch-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fufcord-Patch
          path: android/patch/build/outputs/apk/debug/patch-debug.apk

      - name: Release erstellen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/patch/build/outputs/apk/debug/patch-debug.apk
          generate_release_notes: true
          body: |
            ## 📱 Fufcord — Custom Discord Rich Presence (Android-App)

            **Installation:** APK aufs Handy laden → installieren → im Setup-Assistenten Token eintragen → START.
            Die App läuft im Hintergrund, meldet neue Versionen automatisch per Pop-up und updated per Download von hier.

            **Enthalten:** Hintergrund-Service, Bilder-Upload, 1:1-Discord-Vorschau, Setup-Assistent, Presets, JSON Im-/Export (KI), Doktor mit Auto-Reparatur, Sicher-Modus.

            **Neu: Fufcord Patch (Beta)** — `patch-debug.apk`: Fufcord direkt IN Discord (eigene Einstellungen + Status). Braucht [LSPatch](https://github.com/LSPosed/LSPatch/releases) zum Einbetten, [Anleitung](https://github.com/Fufi1925/Fufcord/blob/main/android/patch/README-PATCH.md). Experimentell!

            **Quellcode:** Vollständig Open Source (MIT-Lizenz) — siehe Tab **Code** → Ordner `android/`. © 2026 Fufcord, alle Rechte vorbehalten.
