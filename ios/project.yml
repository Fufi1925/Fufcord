name: Fufcord
options:
  bundleIdPrefix: com.fufcord
  deploymentTarget:
    iOS: "17.0"
targets:
  Fufcord:
    type: application
    platform: iOS
    sources:
      - path: Fufcord
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fufcord.app
        MARKETING_VERSION: "1.14"
        CURRENT_PROJECT_VERSION: "17"
        INFOPLIST_FILE: Fufcord/Info.plist
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Fufcord:
    build:
      targets:
        Fufcord: all
    run:
      config: Debug
    archive:
      config: Release
